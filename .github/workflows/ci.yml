name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      approve_production_deploy:
        description: Confirmo el despliegue en producción si todas las comprobaciones pasan
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-and-e2e:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.actor == 'fernandezpastoreduardo' && github.triggering_actor == 'fernandezpastoreduardo')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: grumphya_test
          POSTGRES_USER: grumphya_test
          POSTGRES_PASSWORD: grumphya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grumphya_test -d grumphya_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      development-security-postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: development_security_test_admin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: development-security-test-admin-password
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d development_security_test_admin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      ANONYMOUS_USAGE_TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      REGISTRATION_TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      WORST_IDEAS_USER_TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      WORST_IDEAS_RANKING_TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      USER_DELETE_TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      CONTACT_MESSAGE_TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      BEST_USERS_TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      ADMIN_DASHBOARD_TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      APPROVED_IDEAS_TEST_DATABASE_URL: postgresql://grumphya_test:grumphya_test@127.0.0.1:5432/grumphya_test
      DS_TEST_POSTGRES_ISOLATED: "1"
      DS_TEST_DATABASE_URL: postgresql://postgres:development-security-test-admin-password@127.0.0.1:5433/development_security_test_admin
      ACCESS_TOKEN_SECRET: ci-only-secret-with-more-than-32-bytes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run production source preflight guards
        run: bash scripts/ci-preflight.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run local quality gates
        run: pnpm ci:verify quality
      - name: Run Desarrollo Seguro PostgreSQL integration suite
        run: pnpm --filter @grumphya/prototype-desarrollo-seguro-persistence test:postgres

  e2e:
    name: Browser end-to-end tests
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.actor == 'fernandezpastoreduardo' && github.triggering_actor == 'fernandezpastoreduardo')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:verify e2e

  dependency-audit:
    name: Dependency security audit
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.actor == 'fernandezpastoreduardo' && github.triggering_actor == 'fernandezpastoreduardo')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm ci:verify audit

  supply-chain:
    name: Build, scan and deploy production release
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.actor == 'fernandezpastoreduardo' && github.triggering_actor == 'fernandezpastoreduardo')
    needs: [quality-and-e2e, e2e, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose GitHub Actions cache runtime to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Install the pinned Trivy scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
      - name: Build images while downloading the Trivy vulnerability database
        env:
          DOMAIN: ci.invalid
          DEPLOY_SHA: ${{ github.sha }}
          API_IMAGE: grumphya-api:${{ github.sha }}
          WEB_IMAGE: grumphya-web:${{ github.sha }}
          DATABASE_IMAGE: grumphya-database:${{ github.sha }}
          PROXY_IMAGE: grumphya-proxy:${{ github.sha }}
          DEVELOPMENT_SECURITY_IMAGE: development-security-production:${{ github.sha }}
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/compose.build-cache.yaml" <<'EOF'
          services:
            proxy:
              build:
                cache_from:
                  - type=gha,scope=grumphya-caddy
                cache_to:
                  - type=gha,scope=grumphya-caddy,mode=max,ignore-error=true
          EOF
          trivy --cache-dir "$RUNNER_TEMP/trivy-db" image --download-db-only \
            > "$RUNNER_TEMP/trivy-db-download.log" 2>&1 &
          database_pid=$!
          build_status=0
          docker compose --parallel 4 \
            --file compose.production.yaml \
            --file "$RUNNER_TEMP/compose.build-cache.yaml" \
            build --pull api web db proxy || build_status=$?
          if (( build_status != 0 )); then
            kill "$database_pid" 2>/dev/null || true
            wait "$database_pid" 2>/dev/null || true
            cat "$RUNNER_TEMP/trivy-db-download.log"
            exit "$build_status"
          fi
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --pull \
            --load \
            --target development-security-production \
            --tag "$DEVELOPMENT_SECURITY_IMAGE" \
            --build-arg "DEPLOY_SHA=$DEPLOY_SHA" \
            --cache-from type=gha,scope=development-security-api \
            --cache-to type=gha,scope=development-security-api,mode=max,ignore-error=true \
            --file Dockerfile . || build_status=$?
          if (( build_status != 0 )); then
            kill "$database_pid" 2>/dev/null || true
            wait "$database_pid" 2>/dev/null || true
            cat "$RUNNER_TEMP/trivy-db-download.log"
            exit "$build_status"
          fi
          if ! wait "$database_pid"; then
            cat "$RUNNER_TEMP/trivy-db-download.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/trivy-db-download.log"
      - name: Clear temporary BuildKit cache credentials
        if: always()
        shell: bash
        run: |
          {
            echo 'ACTIONS_RUNTIME_TOKEN='
            echo 'ACTIONS_RUNTIME_URL='
            echo 'ACTIONS_CACHE_URL='
          } >> "$GITHUB_ENV"
      - name: Test production image contract
        run: node scripts/test-production-image.mjs grumphya-api:${{ github.sha }}
      - name: Scan production images sequentially
        shell: bash
        env:
          API_IMAGE: grumphya-api:${{ github.sha }}
          WEB_IMAGE: grumphya-web:${{ github.sha }}
          DATABASE_IMAGE: grumphya-database:${{ github.sha }}
          PROXY_IMAGE: grumphya-proxy:${{ github.sha }}
          DEVELOPMENT_SECURITY_IMAGE: development-security-production:${{ github.sha }}
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d "$RUNNER_TEMP/trivy-scans.XXXXXX")
          scan_status=0
          for image in "$API_IMAGE" "$WEB_IMAGE" "$DATABASE_IMAGE" "$PROXY_IMAGE" "$DEVELOPMENT_SECURITY_IMAGE"; do
            name=${image%%:*}
            if TRIVY_SKIP_DB_UPDATE=true TRIVY_SKIP_JAVA_DB_UPDATE=true trivy image \
              --skip-version-check \
              --disable-telemetry \
              --cache-dir "$RUNNER_TEMP/trivy-db" \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$image" > "$scan_dir/$name.log" 2>&1; then
              :
            else
              scan_status=1
            fi
          done
          for image in "$API_IMAGE" "$WEB_IMAGE" "$DATABASE_IMAGE" "$PROXY_IMAGE" "$DEVELOPMENT_SECURITY_IMAGE"; do
            cat "$scan_dir/${image%%:*}.log"
          done
          exit "$scan_status"
      - name: Smoke test the scanned production images with isolated Compose resources
        run: bash scripts/test-production-compose.sh "${{ github.sha }}"
      - name: Save scanned release images
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'fernandezpastoreduardo' &&
          github.triggering_actor == 'fernandezpastoreduardo' &&
          github.ref == 'refs/heads/main' &&
          inputs.approve_production_deploy == true &&
          needs.quality-and-e2e.result == 'success' &&
          needs.e2e.result == 'success' &&
          needs.dependency-audit.result == 'success' &&
          vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          mkdir -p release
          echo "Saving the five scanned images for $GITHUB_SHA."
          docker image inspect development-security-production:${{ github.sha }} >/dev/null
          docker save --output release/images.tar \
            grumphya-api:${{ github.sha }} \
            grumphya-web:${{ github.sha }} \
            grumphya-database:${{ github.sha }} \
            grumphya-proxy:${{ github.sha }} \
            development-security-production:${{ github.sha }}
          du -h release/images.tar
      - name: Assemble production release bundle
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'fernandezpastoreduardo' &&
          github.triggering_actor == 'fernandezpastoreduardo' &&
          github.ref == 'refs/heads/main' &&
          inputs.approve_production_deploy == true &&
          needs.quality-and-e2e.result == 'success' &&
          needs.e2e.result == 'success' &&
          needs.dependency-audit.result == 'success' &&
          vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          echo "Assembling release metadata and deployment bundle for $GITHUB_SHA."
          mkdir -p release/docker release/migrations
          test -s release/images.tar
          cp compose.production.yaml release/compose.production.yaml
          cp -R docker/. release/docker/
          cp apps/api/migrations/*.sql release/migrations/
          cat > release/release.env <<'EOF'
          DEPLOY_SHA=${{ github.sha }}
          API_IMAGE=grumphya-api:${{ github.sha }}
          WEB_IMAGE=grumphya-web:${{ github.sha }}
          DATABASE_IMAGE=grumphya-database:${{ github.sha }}
          PROXY_IMAGE=grumphya-proxy:${{ github.sha }}
          EOF
          tar -C release -czf release-bundle.tar.gz compose.production.yaml docker migrations images.tar release.env
          du -h release-bundle.tar.gz
      - name: Preflight production deployment
        id: production-preflight
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'fernandezpastoreduardo' &&
          github.triggering_actor == 'fernandezpastoreduardo' &&
          github.ref == 'refs/heads/main' &&
          inputs.approve_production_deploy == true &&
          needs.quality-and-e2e.result == 'success' &&
          needs.e2e.result == 'success' &&
          needs.dependency-audit.result == 'success' &&
          vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${PRODUCTION_SSH_HOST:?Create secret PRODUCTION_SSH_HOST}"
          : "${PRODUCTION_SSH_USER:?Create secret PRODUCTION_SSH_USER}"
          : "${PRODUCTION_SSH_PRIVATE_KEY:?Create secret PRODUCTION_SSH_PRIVATE_KEY}"
          : "${PRODUCTION_SSH_KNOWN_HOSTS:?Create secret PRODUCTION_SSH_KNOWN_HOSTS}"
          : "${PRODUCTION_DOMAIN:?Create variable PRODUCTION_DOMAIN}"
          [[ "$PRODUCTION_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$PRODUCTION_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          ssh_port=${PRODUCTION_SSH_PORT:-22}
          [[ "$ssh_port" =~ ^[0-9]{1,5}$ ]]
          (( 10#$ssh_port > 0 && 10#$ssh_port <= 65535 ))
          release_file=release-bundle.tar.gz
          test -s "$release_file"
          release_bytes=$(stat -c '%s' "$release_file")
          release_sha256=$(sha256sum "$release_file" | cut -d ' ' -f 1)
          install -d -m 700 "$RUNNER_TEMP/production-ssh"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/production-ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/production-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/production-ssh/id_ed25519" "$RUNNER_TEMP/production-ssh/known_hosts"
          ssh_args=(-i "$RUNNER_TEMP/production-ssh/id_ed25519" -p "$ssh_port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/production-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh_target="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
          if ! helper_version=$(ssh "${ssh_args[@]}" "$ssh_target" helper-version); then
            echo '::error::The VPS deployment helper is outdated or unreachable. Recover administrative SSH access and install the reviewed helper before retrying.'
            exit 1
          fi
          if [[ "$helper_version" != 2 ]]; then
            echo "::error::The VPS deployment helper is version $helper_version; version 2 is required. Recover administrative SSH access and install the reviewed helper before retrying."
            exit 1
          fi
          echo "Checking VPS capacity and current release before transferring $release_bytes bytes."
          previous_sha=$(ssh "${ssh_args[@]}" "$ssh_target" "preflight $GITHUB_SHA $release_bytes")
          [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "release_bytes=$release_bytes"
            echo "release_sha256=$release_sha256"
            echo "previous_sha=$previous_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Deploy and verify, rolling back on failed public health checks
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'fernandezpastoreduardo' &&
          github.triggering_actor == 'fernandezpastoreduardo' &&
          github.ref == 'refs/heads/main' &&
          inputs.approve_production_deploy == true &&
          needs.quality-and-e2e.result == 'success' &&
          needs.e2e.result == 'success' &&
          needs.dependency-audit.result == 'success' &&
          vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          RELEASE_BYTES: ${{ steps.production-preflight.outputs.release_bytes }}
          RELEASE_SHA256: ${{ steps.production-preflight.outputs.release_sha256 }}
          PREVIOUS_RELEASE_SHA: ${{ steps.production-preflight.outputs.previous_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${PRODUCTION_SSH_HOST:?Create secret PRODUCTION_SSH_HOST}"
          : "${PRODUCTION_SSH_USER:?Create secret PRODUCTION_SSH_USER}"
          : "${PRODUCTION_SSH_PRIVATE_KEY:?Create secret PRODUCTION_SSH_PRIVATE_KEY}"
          : "${PRODUCTION_SSH_KNOWN_HOSTS:?Create secret PRODUCTION_SSH_KNOWN_HOSTS}"
          : "${PRODUCTION_DOMAIN:?Create variable PRODUCTION_DOMAIN}"
          [[ "$PRODUCTION_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$PRODUCTION_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          ssh_port=${PRODUCTION_SSH_PORT:-22}
          [[ "$ssh_port" =~ ^[0-9]{1,5}$ ]]
          (( 10#$ssh_port > 0 && 10#$ssh_port <= 65535 ))
          release_file=release-bundle.tar.gz
          test -s "$release_file"
          release_bytes=$(stat -c '%s' "$release_file")
          release_sha256=$(sha256sum "$release_file" | cut -d ' ' -f 1)
          [[ "$release_bytes" == "$RELEASE_BYTES" && "$release_sha256" == "$RELEASE_SHA256" ]]
          install -d -m 700 "$RUNNER_TEMP/production-ssh"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/production-ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/production-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/production-ssh/id_ed25519" "$RUNNER_TEMP/production-ssh/known_hosts"
          ssh_args=(-i "$RUNNER_TEMP/production-ssh/id_ed25519" -p "$ssh_port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/production-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh_target="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
          verify_previous_release() {
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "https://$PRODUCTION_DOMAIN/" >/dev/null
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "https://$PRODUCTION_DOMAIN/api/health" > "$RUNNER_TEMP/health.json"
            node -e 'const health = require(process.argv[1]); if (health.revision !== process.argv[2]) process.exit(1)' "$RUNNER_TEMP/health.json" "$PREVIOUS_RELEASE_SHA"
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "https://$PRODUCTION_DOMAIN/build.json" > "$RUNNER_TEMP/web-build.json"
            node -e 'const build = require(process.argv[1]); if (build.revision !== process.argv[2]) process.exit(1)' "$RUNNER_TEMP/web-build.json" "$PREVIOUS_RELEASE_SHA"
            echo "Rollback health check passed for revision $PREVIOUS_RELEASE_SHA."
          }
          request_rollback_and_verify() {
            trap - ERR
            echo "Deployment verification failed; requesting rollback to the previous release."
            ssh "${ssh_args[@]}" "$ssh_target" rollback
            verify_previous_release
          }
          echo "Transferring verified release bundle ($release_bytes bytes)."
          if ! ssh "${ssh_args[@]}" "$ssh_target" "deploy $GITHUB_SHA $release_bytes $release_sha256" < "$release_file"; then
            active_sha=$(ssh "${ssh_args[@]}" "$ssh_target" status)
            if [[ "$active_sha" == "$GITHUB_SHA" ]]; then
              request_rollback_and_verify
            else
              verify_previous_release
            fi
            exit 1
          fi
          trap request_rollback_and_verify ERR
          echo "Release accepted by VPS; checking public application endpoints."
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "https://$PRODUCTION_DOMAIN/" >/dev/null
          curl --fail --silent --show-error "https://$PRODUCTION_DOMAIN/account" >/dev/null
          curl --fail --silent --show-error "https://$PRODUCTION_DOMAIN/api/health" > "$RUNNER_TEMP/health.json"
          node -e 'const health = require(process.argv[1]); if (health.revision !== process.argv[2] || health.status !== "ok") process.exit(1)' "$RUNNER_TEMP/health.json" "$GITHUB_SHA"
          curl --fail --silent --show-error "https://$PRODUCTION_DOMAIN/build.json" > "$RUNNER_TEMP/web-build.json"
          node -e 'const build = require(process.argv[1]); if (build.revision !== process.argv[2]) process.exit(1)' "$RUNNER_TEMP/web-build.json" "$GITHUB_SHA"
          trap - ERR
  deploy-production:
    name: Production deployment confirmed
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'fernandezpastoreduardo' &&
      github.triggering_actor == 'fernandezpastoreduardo' &&
      github.ref == 'refs/heads/main' &&
      inputs.approve_production_deploy == true &&
      needs.supply-chain.result == 'success' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: supply-chain
    runs-on: ubuntu-24.04
    steps:
      - name: Report the verified production release
        run: echo "Production deployment and public health checks passed for $GITHUB_SHA."
