<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta
      name="description"
      content="Grumphya evalúa ideas de apps con mirada crítica, detecta riesgos y te ayuda a decidir qué merece la pena desarrollar."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/grumphya/mascot-isotype.svg"
    />
    <link
      rel="preload"
      href="/assets/fonts/NunitoSans-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/grumphya/stage-curtain-v2.webp"
      as="image"
      fetchpriority="high"
    />
    <title>Grumphya — ideas de apps con los pies en la tierra</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const savedTheme = window.localStorage.getItem("grumphya-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.querySelectorAll(".home-page, .app-page").forEach((page) => {
            page.classList.remove("theme-light", "theme-dark");
            page.classList.add(`theme-${savedTheme}`);
          });
        }
      } catch {
        // The default light theme remains available when browser storage is restricted.
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
