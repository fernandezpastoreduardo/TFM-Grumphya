services:
  db:
    image: ${DATABASE_IMAGE:-grumphya-database:production}
    build:
      context: .
      dockerfile: Dockerfile
      target: database-production
    restart: unless-stopped
    secrets:
      - database_settings
      - postgres_admin_settings
      - source: postgres_tls_cert
        target: postgres_tls.crt
      - source: postgres_tls_key
        target: postgres_tls.key
    command:
      [
        "postgres",
        "-c",
        "ssl=on",
        "-c",
        "ssl_min_protocol_version=TLSv1.2",
        "-c",
        "ssl_cert_file=/run/postgresql/grumphya-tls/server.crt",
        "-c",
        "ssl_key_file=/run/postgresql/grumphya-tls/server.key",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf",
      ]
    volumes:
      - grumphya-production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]

  migrate:
    image: ${API_IMAGE:-grumphya-api:production}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command:
      [
        "sh",
        "/workspace/docker/database-entrypoint.sh",
        "node",
        "apps/api/dist/infrastructure/database/migrate.js",
      ]
    restart: "no"
    user: "0"
    secrets:
      - database_settings
      - postgres_admin_settings
      - source: internal_tls_ca
        target: internal_tls_ca.crt
    environment:
      NODE_ENV: production
      MIGRATIONS_USE_BOOTSTRAP: "true"
      PGSSL_MODE: verify-full
      NODE_EXTRA_CA_CERTS: /run/secrets/internal_tls_ca.crt
      PGHOST: db
      PGPORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  api:
    image: ${API_IMAGE:-grumphya-api:production}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command:
      [
        "sh",
        "/workspace/docker/api-entrypoint.sh",
        "node",
        "apps/api/dist/main.js",
      ]
    restart: unless-stopped
    user: "0"
    secrets:
      - grumphya_env
      - database_settings
      - openai_settings
      - openai_key
      - mail_settings
      - source: internal_tls_ca
        target: internal_tls_ca.crt
      - source: api_tls_cert
        target: api_tls.crt
      - source: api_tls_key
        target: api_tls.key
    environment:
      NODE_ENV: production
      DEPLOY_SHA: ${DEPLOY_SHA:-local}
      REQUIRE_PRODUCTION_SECRETS: "true"
      PGSSL_MODE: verify-full
      NODE_EXTRA_CA_CERTS: /run/secrets/internal_tls_ca.crt
      PGHOST: db
      PGPORT: 5432
      WEB_ORIGIN: ${WEB_ORIGIN:-https://${DOMAIN:?Define DOMAIN for the public website}}
      USER_AVATAR_DIRECTORY: /workspace/var/avatars
      TRUST_PROXY: 172.31.0.254/32
    volumes:
      - grumphya-production-avatars:/workspace/var/avatars
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('https://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks: [backend, egress]

  web:
    image: ${WEB_IMAGE:-grumphya-web:production}
    build:
      context: .
      dockerfile: Dockerfile
      target: web-production
      args:
        DEPLOY_SHA: ${DEPLOY_SHA:-local}
    restart: unless-stopped
    expose: ["8443"]
    secrets:
      - source: internal_tls_ca
        target: internal_tls_ca.crt
      - source: web_tls_cert
        target: web_tls.crt
      - source: web_tls_key
        target: web_tls.key
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "printf 'GET / HTTP/1.1\\r\\nHost: web\\r\\nConnection: close\\r\\n\\r\\n' | openssl s_client -quiet -verify_return_error -verify_hostname web -CAfile /run/secrets/internal_tls_ca.crt -connect 127.0.0.1:8443 -servername web 2>/dev/null | grep -q '^HTTP/1.1 200'",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks: [edge]

  proxy:
    image: ${PROXY_IMAGE:-grumphya-proxy:production}
    build:
      context: .
      dockerfile: docker/Caddy.Dockerfile
    restart: unless-stopped
    user: "0:0"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN without scheme or path}
    secrets:
      - source: internal_tls_ca
        target: internal_tls_ca.crt
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - grumphya-caddy-data:/data
      - grumphya-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.0.254
      backend:
        ipv4_address: 172.31.0.254
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  admin-provision:
    image: ${API_IMAGE:-grumphya-api:production}
    profiles: ["admin"]
    command: ["sh", "/workspace/docker/admin-provision-entrypoint.sh"]
    restart: "no"
    user: "0"
    secrets:
      - database_settings
      - source: internal_tls_ca
        target: internal_tls_ca.crt
      - admin_settings
    environment:
      NODE_ENV: production
      PGSSL_MODE: verify-full
      PGHOST: db
      PGPORT: 5432
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  egress: {}

volumes:
  grumphya-production-postgres:
    name: grumphya-production-postgres
  grumphya-production-avatars:
    name: grumphya-production-avatars
  grumphya-caddy-data:
    name: grumphya-caddy-data
  grumphya-caddy-config:
    name: grumphya-caddy-config

secrets:
  grumphya_env:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/grumphya_env
  database_settings:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/database_settings
  postgres_admin_settings:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/postgres_admin_settings
  openai_settings:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/openai_settings
  openai_key:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/openai_key
  mail_settings:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/mail_settings
  admin_settings:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/admin_settings
  internal_tls_ca:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/internal_tls_ca.crt
  api_tls_cert:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/api_tls.crt
  api_tls_key:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/api_tls.key
  web_tls_cert:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/web_tls.crt
  web_tls_key:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/web_tls.key
  postgres_tls_cert:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/postgres_tls.crt
  postgres_tls_key:
    file: ${GRUMPHYA_SECRETS_DIR:-./.secrets}/postgres_tls.key
