services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    command: ["/bin/sh", "/docker/postgres-entrypoint.sh"]
    secrets:
      - grumphya_env
    ports:
      - "127.0.0.1:${GRUMPHYA_DB_HOST_PORT:-5433}:5432"
    volumes:
      - grumphya-postgres-data:/var/lib/postgresql/data
      - ./docker/initdb/001-enable-pgvector.sql:/docker-entrypoint-initdb.d/001-enable-pgvector.sql:ro
      - ./docker/postgres-entrypoint.sh:/docker/postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: grumphya-app:local
    restart: unless-stopped
    command:
      ["sh", "/workspace/docker/api-entrypoint.sh", "pnpm", "--filter", "@grumphya/api", "start:dev"]
    secrets:
      - grumphya_env
      - openai_settings
      - openai_key
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      PGHOST: db
      PGPORT: 5432
      WEB_ORIGIN: http://127.0.0.1:5173
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: grumphya-app:local
    restart: unless-stopped
    command:
      ["pnpm", "--filter", "@grumphya/web", "exec", "vite", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  grumphya-postgres-data:

secrets:
  grumphya_env:
    file: ./.env.docker
  openai_settings:
    file: ./.env.openai
  openai_key:
    file: ./.env
