server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /run/secrets/web_tls.crt;
    ssl_certificate_key /run/secrets/web_tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header Link "</assets/grumphya/home-grumpy-judge.webp>; rel=preload; as=image; fetchpriority=high; media=\"(min-width: 768px)\"" always;
        default_type text/html;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /precios {
        add_header Cache-Control "no-cache" always;
        default_type text/html;
        try_files /precios.html /index.html;
    }

    location = /desarrollo-seguro {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 308 https://desarrolloseguro.org/;
    }

    location ^~ /desarrollo-seguro/ {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 308 https://desarrolloseguro.org/;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location ~* "^/assets/.+[.-][A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html /app.html;
    }
}
